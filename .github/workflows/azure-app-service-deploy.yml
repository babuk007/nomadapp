name: Deploy Container to Azure App Service

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
  SERVICE_NAME: nomad-app
  APP_SERVICE_NAME: ${{ secrets.AZURE_APP_SERVICE_NAME || github.event.repository.name }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Sanitize App Service Name
        run: |
          SAN_APP_NAME=$(echo "${{ env.APP_SERVICE_NAME }}" | tr '_' '-' | tr '[:upper:]' '[:lower:]' | cut -c1-50 | sed 's/^-//;s/-$//')
          echo "APP_SERVICE_NAME=$SAN_APP_NAME" >> $GITHUB_ENV

      - name: Ensure App Service Plan & Web App exist
        run: |
          az appservice plan show --name appmod-service-plan --resource-group rg-appmod-agentic || \
          az appservice plan create --name appmod-service-plan --resource-group rg-appmod-agentic --sku B1 --is-linux --location eastus
          
          az webapp show --name ${{ env.APP_SERVICE_NAME }} --resource-group rg-appmod-agentic || \
          az webapp create --name ${{ env.APP_SERVICE_NAME }} --resource-group rg-appmod-agentic --plan appmod-service-plan --deployment-container-image-name ${{ env.ACR_NAME }}.azurecr.io/${{ env.SERVICE_NAME }}:latest

      - name: Get ACR Access Token
        id: acr-token
        run: |
          TOKEN=$(az acr login --name ${{ env.ACR_NAME }} --expose-token --output tsv --query accessToken)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_ACR_USERNAME || '00000000-0000-0000-0000-000000000000' }}
          password: ${{ secrets.AZURE_ACR_PASSWORD || steps.acr-token.outputs.token }}

      - name: Build and Push Image
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.SERVICE_NAME }}:${{ github.sha }} .
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_SERVICE_NAME }}
          images: ${{ env.ACR_NAME }}.azurecr.io/${{ env.SERVICE_NAME }}:${{ github.sha }}

